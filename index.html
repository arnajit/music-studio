<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Music Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF0F5; --surface:#FFFFFF; --surface-2:#E4E7EF; --ink:#1B2140; --muted:#59607E; --line:#D4D8E3;
  --accent:#1E7457; --accent-ink:#FFFFFF; --accent-soft:#DAEEE5;
  --amber:#8F5E00; --amber-soft:#FBEDCC; --red:#A82B38; --red-soft:#F8DDE0; --staff:rgba(27,33,64,.10);
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11142A; --surface:#1A1E37; --surface-2:#242944; --ink:#E7E9F4; --muted:#A0A6C4; --line:#323858;
    --accent:#55C29A; --accent-ink:#0B1A14; --accent-soft:#173A2E;
    --amber:#EDB653; --amber-soft:#3A2E14; --red:#F2838D; --red-soft:#3E1D24; --staff:rgba(231,233,244,.09); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11142A; --surface:#1A1E37; --surface-2:#242944; --ink:#E7E9F4; --muted:#A0A6C4; --line:#323858;
  --accent:#55C29A; --accent-ink:#0B1A14; --accent-soft:#173A2E;
  --amber:#EDB653; --amber-soft:#3A2E14; --red:#F2838D; --red-soft:#3E1D24; --staff:rgba(231,233,244,.09); color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body.locked{overflow:hidden}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;font-weight:700}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding:0 18px 60px}

.hero{position:relative;padding:28px 0 22px;overflow:hidden}
.hero::before{content:"";position:absolute;left:0;right:0;top:44px;height:72px;background:repeating-linear-gradient(to bottom,var(--staff) 0 1px,transparent 1px 18px);pointer-events:none}
.hero .app{position:relative;color:var(--muted);font-size:.95rem;display:flex;justify-content:space-between;gap:6px 14px;flex-wrap:wrap}
.hero h1{position:relative;font-size:clamp(2.3rem,8vw,4rem);font-weight:800;letter-spacing:-.025em;margin:10px 0 6px;line-height:1}
.hero .sub{position:relative;color:var(--muted)}

.syncbtn{border:0;background:transparent;padding:0;cursor:pointer;color:var(--muted);font-size:.92rem;display:inline-flex;align-items:center;gap:7px}
.syncbtn:hover{color:var(--ink)}
.syncbtn .dot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
.syncbtn[data-s="ok"] .dot{background:var(--accent)}
.syncbtn[data-s="saving"] .dot,.syncbtn[data-s="loading"] .dot{background:var(--amber)}
.syncbtn[data-s="offline"] .dot,.syncbtn[data-s="error"] .dot{background:var(--red)}

.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:22px}
@media (max-width:700px){.cards{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:4px}
.card .lbl{color:var(--muted);font-size:.88rem}
.card .big{font-family:var(--display);font-weight:700;font-size:1.35rem;line-height:1.2}
.card .act{margin-top:auto;padding-top:10px;display:flex;gap:6px;flex-wrap:wrap}
.card .clip{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--muted);font-size:.92rem}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:700;font-size:.92rem;color:var(--ink);line-height:1.2}
.btn:hover{border-color:var(--muted)}
.btn:disabled{opacity:.6;cursor:wait}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:5px 10px;font-size:.85rem}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.danger{color:var(--red)}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.8rem;font-weight:700;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.pill.good{background:var(--accent-soft);color:var(--accent)}
.pill.warn{background:var(--amber-soft);color:var(--amber)}
.pill.bad{background:var(--red-soft);color:var(--red)}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;padding-top:6px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.tabs button{border:0;background:transparent;padding:10px 14px;cursor:pointer;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.bar input{flex:1 1 220px;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 11px}

.entry{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.entry+.entry{margin-top:10px}
.entry .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.entry .when{font-family:var(--display);font-weight:700;font-size:1.08rem}
.entry .t{color:var(--muted);font-size:.9rem;font-weight:400;font-family:var(--body)}
.entry .txt{white-space:pre-wrap}
.entry .sub{margin-top:8px;font-size:.93rem;white-space:pre-wrap}
.entry .sub b{color:var(--muted)}
.entry .tools{display:flex;gap:4px;margin-top:8px;margin-left:-8px}

.fees{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.fee{display:flex;align-items:center;gap:12px;padding:13px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.fee:first-child{border-top:0}
.fee .m{font-weight:700;min-width:140px}
.fee .info{flex:1;color:var(--muted);font-size:.92rem;min-width:150px}
.total{display:flex;gap:20px;flex-wrap:wrap;margin-bottom:14px;color:var(--muted)}
.total strong{color:var(--ink);font-family:var(--display);font-size:1.15rem}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
dl{display:grid;grid-template-columns:auto 1fr;gap:8px 18px;margin:0}
dt{color:var(--muted)} dd{margin:0;font-weight:700;text-align:right;white-space:pre-wrap}
.empty{border:1px dashed var(--line);border-radius:12px;padding:22px;color:var(--muted);text-align:center}
.empty .btn{margin-top:10px}
.muted{color:var(--muted)} .small{font-size:.88rem}
.err{color:var(--red);font-size:.92rem;min-height:1.2em}

.scrim{position:fixed;inset:0;background:rgba(10,12,28,.5);z-index:50}
.modal{position:fixed;z-index:51;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100vw - 24px));max-height:calc(100% - 32px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal form{display:flex;flex-direction:column;min-height:0;flex:1}
.modal header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal header h2{font-size:1.15rem}
.x{border:0;background:transparent;font-size:1.5rem;cursor:pointer;color:var(--muted);line-height:1;padding:2px 8px;border-radius:6px}
.mbody{padding:16px 18px;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.modal footer{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line);align-items:center;flex-wrap:wrap}
.grow{flex:1}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>span{font-size:.88rem;font-weight:700}
.fld>span em{font-style:normal;font-weight:400;color:var(--muted)}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 11px;width:100%;min-width:0}
.fld textarea{resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:460px){.row{grid-template-columns:1fr}}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg label{border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:700;font-size:.9rem}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--ink);color:var(--surface);border-color:var(--ink)}
.seg label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.hint{color:var(--muted);font-size:.86rem}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--surface);padding:10px 18px;border-radius:10px;font-weight:700;opacity:0;pointer-events:none;transition:.2s;z-index:80}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
"use strict";
const KEY = 'my-music-studio-simple-v1';       // local copy (also lets old data move into the sheet)
const CFG_KEY = 'my-music-studio-sync-v1';     // web app URL + passcode for this device
const OUT_KEY = 'my-music-studio-outbox-v1';   // changes not yet saved to the sheet
const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const METHODS = ['UPI','Cash','Bank Transfer'];
const EMPTY = () => ({ student:null, next:null, classes:{}, fees:{} });
let S = EMPTY();
let tab = 'classes', q = '';

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const p2 = n => String(n).padStart(2,'0');
const iso = d => d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const today = () => iso(new Date());
const parseD = s => new Date(s+'T00:00:00');
const addDays = (s,n) => { const d=parseD(s); d.setDate(d.getDate()+n); return iso(d); };
const fmtDate = s => s ? parseD(s).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}) : '—';
const fmtDay = s => s ? parseD(s).toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'}) : '—';
const fmtMonth = ym => new Date(ym+'-01T00:00:00').toLocaleDateString('en-IN',{month:'long',year:'numeric'});
const fmtTime = t => t ? new Date('1970-01-01T'+t+':00').toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit'}) : '';
const inr = n => '₹' + Number(n||0).toLocaleString('en-IN');
const nextMonth = ym => { const [y,m]=ym.split('-').map(Number); return m===12 ? (y+1)+'-01' : y+'-'+p2(m+1); };
const readJSON = k => { try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } };
const writeJSON = (k,v) => { try { v==null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch(e){} };
const normal = d => ({ student:d?.student||null, next:d?.next||null, classes:d?.classes||{}, fees:d?.fees||{} });
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove('show'),2400); }

/* ---------- local copy ---------- */
function load(){ const r=readJSON(KEY); if (r) S=normal(r); }
function save(){ writeJSON(KEY, S); }

/* ---------- Google Sheet sync ---------- */
let cfg = readJSON(CFG_KEY);                 // {url, key}
let outbox = readJSON(OUT_KEY) || [];
let sync = { state:'ok', msg:'' };
let remote = { checked:false, err:'' };      // has this device loaded from the sheet yet?
let seq = 0, flushP = null, refreshing = false;

async function api(action, data={}, c=cfg){
  let res;
  try {
    res = await fetch(c.url, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({ ...data, action, key:c.key }) });
  } catch(e){ throw new Error('offline'); }
  let j;
  try { j = await res.json(); }
  catch(e){ const er=new Error('The web app didn’t send back data. Check it’s deployed with access for “Anyone”.'); er.server=true; throw er; }
  if (!j.ok){ const er=new Error(j.error||'Unknown error'); er.server=true; throw er; }
  return j;
}

/* Every change is queued, then sent in order. If you're offline it waits and retries. */
function push(action, data){
  outbox.push(JSON.parse(JSON.stringify({ action, ...data })));
  seq++; writeJSON(OUT_KEY, outbox); flush();
}
function flush(){ if (!flushP) flushP = doFlush().finally(()=>{ flushP=null; }); return flushP; }
async function doFlush(){
  if (!cfg) return false;
  while (outbox.length){
    setSync('saving');
    try { await api(outbox[0].action, outbox[0]); }
    catch(e){ setSync(e.server?'error':'offline', e.server?e.message:''); return false; }
    outbox.shift(); writeJSON(OUT_KEY, outbox);
  }
  setSync('ok'); return true;
}

/* Send waiting changes, then pull the latest from the sheet. */
async function refresh(){
  if (!cfg || refreshing) return;
  refreshing = true;
  try {
    if (!(await flush())){ firstLoadFailed(); return; }
    const s0 = seq; setSync('loading');
    let j;
    try { j = await api('get'); }
    catch(e){ setSync(e.server?'error':'offline', e.server?e.message:''); firstLoadFailed(); return; }
    if (seq !== s0 || outbox.length){ flush(); return; }   // you changed something meanwhile; keep yours
    const before = JSON.stringify(S);
    S = normal(j.data); save();
    const first = !remote.checked; remote = { checked:true, err:'' };
    setSync('ok');
    if (first || JSON.stringify(S) !== before) render();
  } finally { refreshing = false; }
}
function firstLoadFailed(){
  if (remote.checked) return;
  remote.err = sync.state==='error' ? sync.msg : 'Can’t reach the Google Sheet. Check your internet connection.';
  if (!S.student) render();
}

function syncText(){
  const n = outbox.length, w = n+' change'+(n===1?'':'s')+' waiting';
  switch (sync.state){
    case 'saving': return 'Saving…';
    case 'loading': return 'Checking for updates…';
    case 'offline': return 'Offline, '+w;
    case 'error': return 'Not saving to the sheet';
    default: return n ? w : 'Saved to Google Sheet';
  }
}
function setSync(state, msg=''){
  sync = { state, msg };
  const b = $('#sync');
  if (b){ b.dataset.s = state; b.querySelector('span:last-child').textContent = syncText(); }
  const p = $('#syncPanel'); if (p) p.innerHTML = syncPanelInner();
}
function syncPanelInner(){
  let t = esc(syncText())+'.';
  if (sync.state==='error') t += ' '+esc(sync.msg)+'.';
  if (sync.state==='offline') t += ' They’ll be sent when you’re back online.';
  return t;
}

/* ---------- derived ---------- */
const classes = () => Object.values(S.classes).sort((a,b)=>(b.date+(b.time||'')).localeCompare(a.date+(a.time||'')));
const hasClassOn = d => Object.values(S.classes).some(c=>c.date===d);
function nextClass(){
  const t = today();
  if (S.next && S.next.date >= t && !hasClassOn(S.next.date)) return {...S.next, custom:true};
  const st = S.student; if (!st || st.day==='' || st.day==null) return null;
  for (let i=0;i<8;i++){ const d=addDays(t,i); if (parseD(d).getDay()===Number(st.day) && !hasClassOn(d)) return {date:d, time:st.time, custom:false}; }
  return null;
}
function months(){
  const out=[]; let m=(S.student.joinDate||today()).slice(0,7); const end=today().slice(0,7);
  while (m<=end && out.length<240){ out.push(m); m=nextMonth(m); }
  return out.reverse();
}
function feeInfo(m){
  const r=S.fees[m]||{}, due=Number(r.due ?? S.student.fee ?? 0), paid=Number(r.amount||0);
  const status = paid>=due && due>0 ? 'Paid' : paid>0 ? 'Part paid' : 'Not paid';
  return {...r, month:m, due, paid, bal:Math.max(0,due-paid), status};
}
const tone = s => s==='Paid'?'good':s==='Part paid'?'warn':'bad';

/* ---------- modal ---------- */
const fld = (name,label,val='',type='text',extra='') => `<label class="fld"><span>${label}</span><input name="${name}" type="${type}" value="${esc(val)}" ${extra}></label>`;
const area = (name,label,val='',rows=3,ph='') => `<label class="fld"><span>${label}</span><textarea name="${name}" rows="${rows}" placeholder="${esc(ph)}">${esc(val)}</textarea></label>`;
function openModal({title, body, ok='Save', onSave, left=''}){
  $('#modal-root').innerHTML = `<div class="scrim" data-act="close"></div><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt"><form id="mf" novalidate>
    <header><h2 id="mt">${title}</h2><button type="button" class="x" data-act="close" aria-label="Close">×</button></header>
    <div class="mbody">${body}</div>
    <footer>${left}<span class="grow"></span><button type="button" class="btn" data-act="close">${onSave?'Cancel':'Close'}</button>${onSave?`<button class="btn primary" type="submit">${ok}</button>`:''}</footer></form></div>`;
  document.body.classList.add('locked');
  const f=$('#mf');
  f.onsubmit = e => { e.preventDefault(); if (onSave && onSave(Object.fromEntries(new FormData(f)))!==false) close(); };
  setTimeout(()=>{ const el=f.querySelector('.mbody input,.mbody textarea'); el&&el.focus(); },40);
}
function close(){ $('#modal-root').innerHTML=''; document.body.classList.remove('locked'); }
function confirmBox(msg, yes, fn){
  openModal({title:'Are you sure?', body:`<p>${msg}</p>`, left:`<button type="button" class="btn danger" id="yes">${yes}</button>`});
  $('#yes').onclick = () => { close(); fn(); };
}
document.addEventListener('keydown', e => { if (e.key==='Escape') close(); });

/* ---------- forms ---------- */
function classForm(c){
  const nc = nextClass();
  const d = c || {id:uid(), date:today(), time: (nc && nc.date===today() ? nc.time : S.student.time) || '', did:'', homework:'', notes:''};
  openModal({ title: c?'Edit class':'Add a class', ok: c?'Save changes':'Save class',
    body: `<div class="row">${fld('date','Date',d.date,'date')}${fld('time','Time',d.time,'time')}</div>
      ${area('did','What we did',d.did,6,'Revised C, F and G chords. Transitions still slow. Started the new song intro.')}
      ${area('homework','Homework <em>(optional)</em>',d.homework,2,'Practise C–F–G changes, 15 minutes daily')}
      ${area('notes','Notes for next time <em>(optional)</em>',d.notes,2,'Start with chord changes, then the song')}`,
    left: c?`<button type="button" class="btn danger" data-act="delClass" data-id="${c.id}">Delete</button>`:'',
    onSave: v => {
      if (!v.date){ toast('Choose a date'); return false; }
      if (!v.did.trim()){ toast('Write what you did in this class'); return false; }
      S.classes[d.id] = {...d, ...v}; save(); push('saveClass', {cls:S.classes[d.id]});
      toast(c?'Class updated':'Class saved'); render();
    }});
}
function nextForm(){
  const nc = nextClass() || {date:today(), time:S.student.time||''};
  openModal({ title:'Next class', ok:'Save',
    body: `<div class="row">${fld('date','Date',nc.date,'date')}${fld('time','Time',nc.time,'time')}</div>
      <p class="hint">Change this whenever the day or time moves. Once that class is recorded, it goes back to the usual ${esc(DAYS[S.student.day]||'day')}.</p>`,
    left: S.next ? `<button type="button" class="btn ghost" data-act="resetNext">Use usual day</button>` : '',
    onSave: v => { if(!v.date){ toast('Choose a date'); return false; }
      S.next={date:v.date,time:v.time}; save(); push('saveNext', {next:S.next}); toast('Next class set'); render(); }});
}
function feeForm(m){
  const f = feeInfo(m);
  openModal({ title:'Fee for '+fmtMonth(m), ok:'Save',
    body: `<div class="row">${fld('amount','Amount paid (₹)',f.paid||f.due,'number','min="0" step="1" inputmode="numeric"')}${fld('date','Paid on',f.date||today(),'date')}</div>
      <div class="fld"><span>Paid by</span><div class="seg">${METHODS.map(x=>`<label><input type="radio" name="method" value="${x}" ${(f.method||'UPI')===x?'checked':''}>${x}</label>`).join('')}</div></div>
      ${fld('due','Fee for this month (₹)',f.due,'number','min="0" step="1" inputmode="numeric"')}
      ${fld('note','Note <em>(optional)</em>',f.note||'')}`,
    left: S.fees[m]&&S.fees[m].amount ? `<button type="button" class="btn danger" data-act="unpay" data-id="${m}">Mark not paid</button>` : '',
    onSave: v => { S.fees[m]={amount:Number(v.amount||0), date:v.date, method:v.method||'UPI', due:Number(v.due||0), note:v.note};
      save(); push('saveFee', {month:m, fee:S.fees[m]}); toast('Fee saved'); render(); }});
}
function studentForm(first){
  const s = S.student || {name:'', phone:'', joinDate:today(), fee:1000, day:0, time:'10:00', notes:''};
  const body = `${fld('name','Student name',s.name)}
    ${fld('phone','Phone <em>(optional)</em>',s.phone,'tel')}
    <div class="row">${fld('joinDate','Joined on',s.joinDate,'date')}${fld('fee','Monthly fee (₹)',s.fee,'number','min="0" step="1" inputmode="numeric"')}</div>
    <div class="row"><label class="fld"><span>Usual class day</span><select name="day">${DAYS.map((d,i)=>`<option value="${i}" ${Number(s.day)===i?'selected':''}>${d}</option>`).join('')}</select></label>${fld('time','Usual time',s.time,'time')}</div>
    ${area('notes','Notes <em>(optional)</em>',s.notes,3)}`;
  const onSave = v => { if(!v.name.trim()){ toast('Enter the student’s name'); return false; }
    S.student={...v, name:v.name.trim(), fee:Number(v.fee||0), day:Number(v.day)}; save(); push('saveStudent', {student:S.student}); toast('Saved'); render(); };
  if (first) return {body, onSave};
  openModal({title:'Edit student', body, onSave});
}

/* ---------- connect screen ---------- */
function viewConnect(){
  return `<div class="wrap"><section class="hero"><div class="app"><span>Welcome</span></div><h1>My Music Studio</h1>
    <p class="sub">Connect to your Google Sheet so your records are the same on every device.</p></section>
    <form id="cf" class="panel" novalidate style="display:flex;flex-direction:column;gap:12px">
      ${fld('url','Web app URL','','url','placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off" spellcheck="false"')}
      ${fld('key','Passcode','','password','autocomplete="current-password"')}
      <p class="err" id="cerr" role="alert"></p>
      <div><button class="btn primary" type="submit" id="cbtn">Connect</button></div>
    </form>
    <p class="hint" style="margin-top:10px">You do this once on each phone or computer. Use the URL from Apps Script and the passcode you set there.</p></div>`;
}
async function connect(e){
  e.preventDefault();
  const v = Object.fromEntries(new FormData(e.target)), url = v.url.trim(), key = v.key;
  const err = $('#cerr'), btn = $('#cbtn');
  if (!/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec$/.test(url)){ err.textContent='Paste the Web app URL from Apps Script. It starts with https://script.google.com and ends with /exec.'; return; }
  if (!key){ err.textContent='Enter the passcode you set in Apps Script.'; return; }
  btn.disabled = true; btn.textContent = 'Connecting…'; err.textContent = '';
  try {
    const j = await api('get', {}, {url, key});
    cfg = {url, key}; writeJSON(CFG_KEY, cfg);
    const d = normal(j.data);
    if (!d.student && S.student){
      // Empty sheet, but this browser already has records: copy them up.
      outbox = [JSON.parse(JSON.stringify({action:'replaceAll', data:S}))]; writeJSON(OUT_KEY, outbox);
      await flush(); toast('Your records were copied to the Google Sheet');
    } else { S = d; save(); toast('Connected'); }
    remote = {checked:true, err:''}; render();
  } catch(ex){
    err.textContent = !ex.server ? 'Couldn’t reach that web app. Check the URL, and that it’s deployed with access for “Anyone”.'
      : ex.message==='Wrong passcode' ? 'That passcode doesn’t match the one in Apps Script.' : ex.message;
    btn.disabled = false; btn.textContent = 'Connect';
  }
}
function viewLoading(){
  return `<div class="wrap"><section class="hero"><div class="app"><span>My Music Studio</span></div><h1>My Music Studio</h1>
    <p class="sub">${remote.err ? '' : 'Loading your records from Google Sheet…'}</p></section>
    ${remote.err ? `<div class="panel"><p class="err" style="margin-bottom:12px">${esc(remote.err)}</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" data-act="retry">Try again</button><button class="btn" data-act="disconnect">Change connection</button></div></div>` : ''}</div>`;
}

/* ---------- views ---------- */
function viewSetup(){
  const f = studentForm(true);
  setTimeout(()=>{ $('#sf').onsubmit = e => { e.preventDefault(); f.onSave(Object.fromEntries(new FormData(e.target))); }; },0);
  return `<div class="wrap"><section class="hero"><div class="app"><span>Welcome</span></div><h1>My Music Studio</h1><p class="sub">Keep track of each class and each month’s fee. Start with your student.</p></section>
    <form id="sf" class="panel" novalidate style="display:flex;flex-direction:column;gap:12px">${f.body}<div><button class="btn primary" type="submit">Get started</button></div></form>
    <p class="hint" style="margin-top:10px">Everything is saved to your Google Sheet.</p></div>`;
}
function viewClasses(){
  const all = classes();
  const words = q.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const items = all.filter(c => { const h=(c.did+' '+c.homework+' '+c.notes).toLowerCase(); return words.every(w=>h.includes(w)); });
  return `<div class="bar"><input type="search" id="q" placeholder="Search classes" value="${esc(q)}" aria-label="Search classes"><button class="btn primary" data-act="addClass">+ Add class</button></div>
    <div id="list">${listHTML(items, all.length)}</div>`;
}
function listHTML(items, total){
  if (!total) return `<div class="empty">No classes yet. After each class, write down what you did.<br><button class="btn primary sm" data-act="addClass">Add your first class</button></div>`;
  if (!items.length) return `<div class="empty">No classes match that search.</div>`;
  return items.map(c=>`<article class="entry">
    <div class="top"><span class="when">${fmtDay(c.date)} <span class="t">${parseD(c.date).getFullYear()}${c.time?', '+fmtTime(c.time):''}</span></span></div>
    <p class="txt">${esc(c.did)}</p>
    ${c.homework?`<p class="sub"><b>Homework:</b> ${esc(c.homework)}</p>`:''}
    ${c.notes?`<p class="sub"><b>Next time:</b> ${esc(c.notes)}</p>`:''}
    <div class="tools"><button class="btn ghost sm" data-act="editClass" data-id="${c.id}">Edit</button></div>
  </article>`).join('');
}
function viewFees(){
  const ms = months().map(feeInfo);
  const collected = Object.values(S.fees).reduce((s,f)=>s+Number(f.amount||0),0);
  const pending = ms.reduce((s,m)=>s+m.bal,0);
  return `<div class="total"><span>Collected <strong>${inr(collected)}</strong></span><span>Pending <strong style="color:${pending?'var(--red)':'inherit'}">${inr(pending)}</strong></span></div>
    <div class="fees">${ms.map(m=>`<div class="fee">
      <span class="m">${fmtMonth(m.month)}</span>
      <span class="pill ${tone(m.status)}">${m.status}</span>
      <span class="info">${m.paid ? `${inr(m.paid)}${m.bal?' of '+inr(m.due):''} on ${fmtDate(m.date)}, ${esc(m.method)}${m.note?'. '+esc(m.note):''}` : inr(m.due)+' due'}</span>
      <button class="btn sm ${m.paid?'ghost':''}" data-act="fee" data-id="${m.month}">${m.paid?'Edit':'Mark as paid'}</button>
    </div>`).join('')}</div>`;
}
function viewStudent(){
  const s = S.student;
  return `<div class="panel"><dl>
      <dt>Name</dt><dd>${esc(s.name)}</dd>
      <dt>Phone</dt><dd>${esc(s.phone||'—')}</dd>
      <dt>Joined on</dt><dd>${fmtDate(s.joinDate)}</dd>
      <dt>Monthly fee</dt><dd>${inr(s.fee)}</dd>
      <dt>Usual class</dt><dd>${esc(DAYS[s.day])}${s.time?', '+fmtTime(s.time):''}</dd>
      <dt>Classes so far</dt><dd>${Object.keys(S.classes).length}</dd>
      ${s.notes?`<dt>Notes</dt><dd style="font-weight:400">${esc(s.notes)}</dd>`:''}
    </dl><div style="margin-top:14px"><button class="btn" data-act="editStudent">Edit details</button></div></div>
    <div class="panel" style="margin-top:12px"><h3 style="margin-bottom:6px">Google Sheet</h3>
      <p class="muted small" id="syncPanel" style="margin-bottom:10px">${syncPanelInner()}</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-act="syncNow">Sync now</button>
      <button class="btn ghost danger" data-act="disconnect">Disconnect this device</button></div></div>
    <div class="panel" style="margin-top:12px"><h3 style="margin-bottom:6px">Backup</h3>
      <p class="muted small" style="margin-bottom:10px">Your records are in your Google Sheet. You can also keep a backup file of your own.</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-act="export">Download backup</button>
      <label class="btn" style="cursor:pointer">Restore from backup<input type="file" id="imp" accept=".json,application/json" hidden></label></div></div>`;
}
function render(){
  load.done || (load(), load.done=true);
  const app=$('#app');
  if (!cfg){ app.innerHTML=viewConnect(); $('#cf').onsubmit=connect; return; }
  if (!S.student && !remote.checked){ app.innerHTML=viewLoading(); return; }
  if (!S.student){ app.innerHTML=viewSetup(); return; }
  const nc=nextClass(), last=classes()[0], cm=today().slice(0,7), f=feeInfo(cm);
  app.innerHTML = `<div class="wrap">
    <section class="hero"><div class="app"><span>${new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long'})}</span>
      <button class="syncbtn" id="sync" data-act="sync" data-s="${sync.state}"><span class="dot"></span><span>${esc(syncText())}</span></button></div>
      <h1>${esc(S.student.name)}</h1><p class="sub">Keyboard/Piano. Usually ${esc(DAYS[S.student.day])}s${S.student.time?' at '+fmtTime(S.student.time):''}.</p></section>
    <div class="cards">
      <div class="card"><span class="lbl">Next class</span>
        <span class="big">${nc?fmtDay(nc.date):'Not set'}</span><span class="muted">${nc&&nc.time?fmtTime(nc.time):''}${nc&&nc.custom?' (changed)':''}</span>
        <div class="act"><button class="btn sm" data-act="next">Change</button>${nc&&nc.date<=today()?'<button class="btn sm primary" data-act="addClass">Add class</button>':''}</div></div>
      <div class="card"><span class="lbl">${fmtMonth(cm)} fee</span>
        <span class="big"><span class="pill ${tone(f.status)}" style="font-size:.95rem">${f.status}</span></span>
        <span class="muted">${f.paid?inr(f.paid)+' on '+fmtDate(f.date):inr(f.due)+' due'}</span>
        <div class="act"><button class="btn sm ${f.status==='Paid'?'':'primary'}" data-act="fee" data-id="${cm}">${f.paid?'Edit':'Mark as paid'}</button></div></div>
      <div class="card"><span class="lbl">Last class</span>
        <span class="big">${last?fmtDay(last.date):'None yet'}</span>${last?`<span class="clip">${esc(last.did)}</span>`:''}
        <div class="act"><button class="btn sm ${nc&&nc.date<=today()?'':'primary'}" data-act="addClass">+ Add class</button></div></div>
    </div>
    <div class="tabs" role="tablist">${[['classes','Classes'],['fees','Fees'],['student','Student']].map(([k,l])=>`<button role="tab" aria-selected="${tab===k}" data-act="tab" data-id="${k}">${l}</button>`).join('')}</div>
    <div id="view">${tab==='classes'?viewClasses():tab==='fees'?viewFees():viewStudent()}</div></div>`;
  const qi=$('#q'); if (qi) qi.oninput = e => { q=e.target.value; const all=classes(); const w=q.trim().toLowerCase().split(/\s+/).filter(Boolean); $('#list').innerHTML=listHTML(all.filter(c=>w.every(x=>(c.did+' '+c.homework+' '+c.notes).toLowerCase().includes(x))), all.length); };
  const imp=$('#imp'); if (imp) imp.onchange = restore;
}

/* ---------- actions ---------- */
const A = {
  close,
  tab: d => { tab=d.id; render(); },
  addClass: () => classForm(null),
  editClass: d => classForm(S.classes[d.id]),
  delClass: d => { close(); confirmBox('Delete this class record?', 'Delete', ()=>{ delete S.classes[d.id]; save(); push('deleteClass', {id:d.id}); toast('Class deleted'); render(); }); },
  next: () => nextForm(),
  resetNext: () => { S.next=null; save(); push('saveNext', {next:null}); close(); toast('Back to the usual day'); render(); },
  fee: d => feeForm(d.id),
  unpay: d => { close(); confirmBox('Mark '+fmtMonth(d.id)+' as not paid?', 'Mark not paid', ()=>{ delete S.fees[d.id]; save(); push('deleteFee', {month:d.id}); render(); }); },
  editStudent: () => studentForm(false),
  sync: () => {
    if (sync.state==='error'){
      openModal({title:'Not saving to the sheet', body:`<p>${esc(sync.msg)}.</p><p class="hint" style="margin-top:8px">Your changes are kept on this device and will be sent once this is fixed.</p>`,
        left:`<button type="button" class="btn" data-act="syncNow">Try again</button>`});
    } else { refresh(); }
  },
  syncNow: () => { close(); toast('Syncing…'); refresh(); },
  retry: () => { remote.err=''; render(); refresh(); },
  disconnect: () => {
    const n = outbox.length;
    confirmBox('Disconnect this device? Your records stay in the Google Sheet.'+(n?` <b>${n} change${n===1?'':'s'} not yet saved to the sheet will be lost.</b>`:''), 'Disconnect', ()=>{
      cfg=null; writeJSON(CFG_KEY, null); outbox=[]; writeJSON(OUT_KEY, outbox);
      S=EMPTY(); save(); remote={checked:false, err:''}; setSync('ok'); render();
    });
  },
  export: () => {
    const blob=new Blob([JSON.stringify({app:'my-music-studio-simple',...S},null,2)],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='music-studio-backup-'+today()+'.json'; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000); toast('Backup downloaded');
  }
};
function restore(e){
  const file=e.target.files[0]; if(!file) return;
  const r=new FileReader();
  r.onload=()=>{ let d; try{ d=JSON.parse(r.result); }catch(err){ toast('That file isn’t a backup'); return; }
    if(!d || d.app!=='my-music-studio-simple'){ toast('That file isn’t a My Music Studio backup'); return; }
    confirmBox('Replace everything in the Google Sheet with this backup?', 'Restore', ()=>{ S=normal(d); save(); push('replaceAll', {data:S}); toast('Backup restored'); render(); }); };
  r.readAsText(file); e.target.value='';
}
document.addEventListener('click', e => { const el=e.target.closest('[data-act]'); if(!el||!A[el.dataset.act]) return; e.preventDefault(); A[el.dataset.act](el.dataset); });

/* Pick up changes made on other devices */
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
window.addEventListener('online', refresh);
setInterval(() => { if (!document.hidden) refresh(); }, 60000);

render();
refresh();
</script>
</body>
</html>
